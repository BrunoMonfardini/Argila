<a class="doc-shell__skip" href="#conteudo">Pular para o conteúdo</a>

<header class="doc-shell__header">
  <button
    arg-button
    type="button"
    variant="tertiary"
    size="sm"
    class="doc-shell__menu"
    aria-controls="navegacao"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    Menu
  </button>
  <a class="doc-shell__logo" routerLink="/">Argila</a>
  <doc-theme-bar class="doc-shell__theme" />
</header>

<div class="doc-shell__body">
  <nav
    id="navegacao"
    class="doc-shell__nav"
    aria-label="Páginas do catálogo"
    [class.doc-shell__nav--open]="menuOpen()"
  >
    <doc-nav-rail [sections]="sections()" (navigate)="closeMenu()" />
  </nav>

  <main id="conteudo" class="doc-shell__main" tabindex="-1">
    @if (notice(); as problems) {
      <div
        arg-alert
        tone="warning"
        heading="O link pedia escolhas que não valem"
        dismissible
        class="doc-shell__notice"
        (dismissed)="dismissNotice()"
      >
        <ul>
          @for (problem of problems; track problem) {
            <li>{{ problem }}</li>
          }
        </ul>
      </div>
    }
    <router-outlet />
  </main>
</div>
