<div
  class="doc-theme-bar__group"
  role="group"
  aria-label="Modo de cor"
  [title]="singleScheme() ? 'Este design system tem um modo só' : ''"
>
  @for (option of schemes; track option.value) {
    <button
      arg-button
      type="button"
      size="sm"
      [variant]="scheme() === option.value ? 'secondary' : 'tertiary'"
      [attr.aria-pressed]="scheme() === option.value"
      [disabled]="!supports(option.value)"
      (click)="selectScheme(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>

<!-- [selected] em cada opção: o [value] do <select> chega antes das opções existirem -->
<label class="doc-theme-bar__field">
  <span>Estilo</span>
  <select arg-select (change)="selectStyle($event)">
    @for (option of styles; track option.value) {
      <option [value]="option.value" [selected]="option.value === style()">
        {{ option.label }}
      </option>
    }
  </select>
</label>

<label class="doc-theme-bar__field">
  <span>Paleta</span>
  <select arg-select (change)="selectPalette($event)">
    @for (option of palettes(); track option.value) {
      <option [value]="option.value" [selected]="option.value === palette()">
        {{ option.label }}
      </option>
    }
  </select>
</label>

@if (backgrounds().length > 1) {
  <label class="doc-theme-bar__field">
    <span>Fundo</span>
    <select arg-select (change)="selectBackground($event)">
      @for (option of backgrounds(); track option.value) {
        <option [value]="option.value" [selected]="option.value === background()">
          {{ option.label }}
        </option>
      }
    </select>
  </label>
  <label arg-choice class="doc-theme-bar__field">
    <input type="checkbox" arg-switch [checked]="motion()" (change)="selectMotion($event)" />
    Movimento
  </label>
}

<details class="doc-theme-bar__colors">
  <summary>Cores</summary>
  <div class="doc-theme-bar__colors-panel">
    <p>Só as cores que passam no contraste neste design system e nesta paleta.</p>
    @for (role of roles; track role.value) {
      <label class="doc-theme-bar__field">
        <span>{{ role.label }}</span>
        <select arg-select (change)="selectColor(role.value, $event)">
          <option value="" [selected]="!colors()[role.value]">Da paleta</option>
          @for (option of colorOptions()[role.value]; track option.value) {
            <option [value]="option.value" [selected]="option.value === colors()[role.value]">
              {{ option.label }}
            </option>
          }
        </select>
      </label>
    }
  </div>
</details>

<label
  class="doc-theme-bar__field"
  [title]="acceptsTransparency() ? '' : 'Este estilo não aceita transparência'"
>
  <span>Opacidade</span>
  <input
    type="range"
    [min]="minOpacity"
    max="100"
    step="5"
    [value]="opacity()"
    [disabled]="!acceptsTransparency()"
    [attr.aria-valuetext]="opacity() + '%'"
    (input)="selectOpacity($event)"
  />
</label>

@if (segments.length) {
  <label class="doc-theme-bar__field">
    <span>Segmento</span>
    <select arg-select (change)="selectSegment($event)">
      <option value="" [selected]="!segment()">Nenhum</option>
      @for (option of segments; track option.value) {
        <option [value]="option.value" [selected]="option.value === segment()">
          {{ option.label }}
        </option>
      }
    </select>
  </label>
}
