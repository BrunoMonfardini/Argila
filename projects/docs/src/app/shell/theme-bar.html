<div class="doc-theme-bar__group" role="group" aria-label="Modo de cor">
  @for (option of schemes; track option.value) {
    <button
      arg-button
      type="button"
      size="sm"
      [variant]="scheme() === option.value ? 'secondary' : 'tertiary'"
      [attr.aria-pressed]="scheme() === option.value"
      [disabled]="!supports(option.value)"
      (click)="selectScheme(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>

<!-- [selected] em cada opção: o [value] do <select> chega antes das opções existirem -->
<label class="doc-theme-bar__field">
  <span>Estilo</span>
  <select arg-select (change)="selectStyle($event)">
    @for (option of styles; track option.value) {
      <option [value]="option.value" [selected]="option.value === style()">
        {{ option.label }}
      </option>
    }
  </select>
</label>

<label class="doc-theme-bar__field">
  <span>Paleta</span>
  <select arg-select (change)="selectPalette($event)">
    @for (option of palettes; track option.value) {
      <option [value]="option.value" [selected]="option.value === palette()">
        {{ option.label }}
      </option>
    }
  </select>
</label>

<label class="doc-theme-bar__field">
  <span>Opacidade</span>
  <input
    type="range"
    [min]="minOpacity"
    max="100"
    step="5"
    [value]="opacity()"
    [attr.aria-valuetext]="opacity() + '%'"
    (input)="selectOpacity($event)"
  />
</label>
