name: Release

on:
  push:
    branches: [main]

# Uma release por vez; nunca cancelar uma publicação no meio
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Só este job pode abrir o PR de versão e publicar no GitHub Packages
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@brunomonfardini'
      - run: pnpm install --frozen-lockfile
      # Com changesets pendentes: abre/atualiza o PR "chore: version packages".
      # Sem changesets (PR de versão mergeado): builda e publica o pacote.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # PR aberto com o GITHUB_TOKEN não dispara o CI, e o ruleset exige verify e
          # pr-checks. Com RELEASE_TOKEN (PAT com contents e pull-requests) os checks rodam.
          # Na v2 o token vai só por este input; a variável GITHUB_TOKEN é ignorada.
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
