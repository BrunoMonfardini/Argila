name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Um novo push na mesma branch cancela a execução anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm icons:check
      - run: pnpm manifest:check
      - run: pnpm test
      - run: pnpm dup:check
      - run: pnpm build
      - run: pnpm build:docs
      - name: Publica o catálogo para o review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: catalogo
          path: dist/docs/browser
          retention-days: 7

  pr-checks:
    name: pr-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O título entra por variável de ambiente, nunca interpolado no comando
      - name: Título do PR segue Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint
      # O merge é rebase: cada commit do PR chega à main como está
      - name: Cada commit segue Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # O PR de versão (changeset-release/main) existe justamente para consumir os changesets
      - name: Mudança no pacote tem changeset
        if: github.actor != 'dependabot[bot]' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
