name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Um novo push no mesmo PR cancela a execução anterior; push na main nunca é cancelado
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Menor permissão possível para o token do workflow
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm icons:check
      - run: pnpm colors:check
      - run: pnpm manifest:check
      # Cobertura e histórico da main: o PR compara com ela, a main acrescenta ao histórico
      - name: Cobertura da main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cobertura-main
          key: cobertura-main-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: cobertura-main-
      - run: pnpm test
      - name: Resumo dos testes
        if: ${{ !cancelled() && hashFiles('reports/junit.xml', 'coverage/coverage-summary.json') != '' }}
        env:
          HISTORICO: ${{ github.event_name == 'push' && '--historico cobertura-main/historico.csv' || '' }}
        run: |
          mkdir -p cobertura-main
          pnpm --silent test:report --base cobertura-main/coverage-summary.json $HISTORICO >> "$GITHUB_STEP_SUMMARY"
      - name: Relatórios dos testes
        if: ${{ !cancelled() && hashFiles('reports/junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testes
          path: |
            reports
            coverage
          retention-days: 14
      - name: Guarda a cobertura da main
        if: github.event_name == 'push'
        run: cp coverage/coverage-summary.json cobertura-main/
      - name: Cobertura da main para os próximos PRs
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cobertura-main
          key: cobertura-main-${{ github.sha }}
      - name: Histórico da cobertura
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-main
          path: cobertura-main
          retention-days: 90
      - run: pnpm dup:check
      - run: pnpm arch:check
      - run: pnpm build
      - run: pnpm build:docs
      - name: Publica o catálogo para o review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogo
          path: dist/docs/browser
          retention-days: 7

  pr-checks:
    name: pr-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O título entra por variável de ambiente, nunca interpolado no comando
      - name: Título do PR segue Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint
      # O merge é rebase: cada commit do PR chega à main como está
      - name: Cada commit segue Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # O PR de versão (changeset-release/main) existe justamente para consumir os changesets
      - name: Mudança no pacote tem changeset
        if: github.actor != 'dependabot[bot]' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
