version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      angular:
        patterns:
          ['@angular/*', '@angular-devkit/*', '@angular-eslint/*', 'angular-eslint', 'ng-packagr']
      storybook:
        patterns: ['storybook', '@storybook/*']
      dev-tools:
        dependency-type: development
        exclude-patterns: ['@angular/*', '@angular-devkit/*', 'storybook', '@storybook/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
